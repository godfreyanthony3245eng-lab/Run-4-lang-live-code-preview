# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run-in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: FIREBASE_CONFIG
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # --- INJECT FIREBASE CONFIG SECRET SAFELY ---
      - name: Inject Firebase Config
        run: |
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("index.html", "utf8");
            const secretConfig = process.env.FIREBASE_CONFIG;
            if (!secretConfig) {
              console.error("❌ FIREBASE_CONFIG secret is missing!");
              process.exit(1);
            }
            html = html.replace("__FIREBASE_CONFIG_PLACEHOLDER__", secretConfig);
            fs.writeFileSync("index.html", html, "utf8");
            console.log("✅ Firebase config successfully injected into index.html");
          '
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
